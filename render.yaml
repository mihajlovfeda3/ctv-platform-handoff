services:
  - type: web
    name: ctv-beta
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node node_modules/next/dist/bin/next start --hostname 0.0.0.0 --port $PORT
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: BETA_AUTH_ENABLED
        value: "true"
      - key: BETA_AUTH_USER
        sync: false
      - key: BETA_AUTH_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
