name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ctv
          POSTGRES_PASSWORD: ctv_ci_synthetic
          POSTGRES_DB: ctv_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ctv -d ctv_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ctv:ctv_ci_synthetic@127.0.0.1:5432/ctv_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Unit and PGlite integration tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Prepare synthetic browser test database
        run: npm run db:migrate && npm run db:seed

      - name: Install Chromium for browser regression
        run: npx playwright install --with-deps chromium

      - name: Catalog UX checks (desktop and narrow viewports)
        run: |
          npx playwright test tests/browser/catalog-33.spec.ts tests/browser/classification.spec.ts --project=1440 --project=1920 --project=768
          npx playwright test tests/browser/navigation-32.spec.ts tests/browser/catalog-polish.spec.ts --project=1440
